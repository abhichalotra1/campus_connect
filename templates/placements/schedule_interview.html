{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-7">
        <div class="card p-4">
            <h3 class="mb-4"><i class="fas fa-calendar-plus text-primary me-2"></i>Schedule Interview</h3>
            <div class="alert alert-info mb-4">
                <strong>Student:</strong> {{ application.student.get_full_name }}<br>
                <strong>Company:</strong> {{ application.drive.company }}<br>
                <strong>Role:</strong> {{ application.drive.role }}
            </div>
            <form method="POST">{% csrf_token %}
                <div class="mb-3"><label class="form-label">Interview Date & Time</label><input type="datetime-local" name="scheduled_at" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Location / Room</label><input type="text" name="location" class="form-control" placeholder="e.g. Room 101 or Online"></div>
                <div class="mb-3"><label class="form-label">Meeting Link (optional)</label><input type="url" name="meeting_link" class="form-control" placeholder="https://meet.google.com/..."></div>
                <div class="mb-3"><label class="form-label">Notes for Student</label><textarea name="notes" class="form-control" rows="3" placeholder="Any instructions for the student..."></textarea></div>
                <button type="submit" class="btn btn-primary w-100"><i class="fas fa-calendar-check me-2"></i>Schedule Interview</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
