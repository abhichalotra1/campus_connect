{% extends 'base.html' %}
{% block content %}
<div class="row mt-5 justify-content-center">
    <div class="col-md-6">
        <div class="card p-5 text-center" style="border-radius: var(--radius-lg); border-color: var(--red);">
            <i class="fas fa-exclamation-triangle fa-3x mb-3" style="color: var(--red);"></i>
            <h4 style="font-family: var(--font-display); font-weight: 700;">Delete Drive?</h4>
            <p class="mt-3" style="color: var(--ink2); line-height: 1.7;">
                Are you sure you want to delete <strong style="color: var(--ink);">{{ drive.role }}</strong> at <strong style="color: var(--ink);">{{ drive.company }}</strong>? <br>All applications for this drive will also be permanently deleted. 
            </p>
            
            <form method="POST" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger" style="font-weight: 700; padding: 10px 24px;">
                    <i class="fas fa-trash me-2"></i>Yes, Delete Drive
                </button>
                <a href="{% url 'drive_list' %}" class="btn ms-2" style="padding: 10px 24px; background: var(--surface); color: var(--ink2); border: 1px solid var(--border2); text-decoration: none; border-radius: 8px;">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
