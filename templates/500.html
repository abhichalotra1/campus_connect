<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0f14; --ink:#eef0ff; --ink2:#8b92b8; --red:#f43f5e; --red-soft:rgba(244,63,94,0.10); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
        h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(80px, 15vw, 140px); font-weight:800; color: var(--red); line-height:1; margin-bottom:10px; }
        h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight:700; margin-bottom:16px; }
        p { color: var(--ink2); font-size: 16px; margin-bottom:32px; line-height:1.6; }
        a { color:#fff; text-decoration:none; padding:12px 28px; border-radius:12px; background:var(--red); font-weight:700; transition:all 0.2s; display:inline-block; }
        a:hover { opacity:0.8; transform:translateY(-2px); }
    </style>
</head>
<body>
    <div>
        <h1>500</h1>
        <h2>Server Error</h2>
        <p>Something went wrong on our end. Our team has been notified. Please try again later.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
