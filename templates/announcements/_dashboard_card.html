{% if dashboard_announcements %}
<div class="panel anim" id="dash-announcements">
  <div class="panel-head">
    <span class="panel-title"><i class="fa-solid fa-bullhorn" style="color:var(--primary2);margin-right:8px;"></i>Announcements</span>
    <a class="panel-link" href="{% url 'announcements' %}">View all <i class="fa-solid fa-arrow-right" style="font-size:10px;"></i></a>
  </div>
  {% for a in dashboard_announcements %}
  <div style="padding:14px 20px;{% if not forloop.last %}border-bottom:1px solid var(--border);{% endif %}{% if a.is_pinned %}background:var(--p-soft);{% endif %}">
    <div style="display:flex;align-items:center;gap:8px;">
      {% if a.is_pinned %}<i class="fa-solid fa-thumbtack" style="color:var(--primary2);font-size:12px;"></i>{% endif %}
      <strong style="font-size:14px;">{{ a.title }}</strong>
    </div>
    <div style="font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5;">{{ a.message|truncatechars:160 }}</div>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:6px;">{{ a.author_label }} · {{ a.created_at|timesince }} ago</div>
  </div>
  {% endfor %}
</div>
{% endif %}
