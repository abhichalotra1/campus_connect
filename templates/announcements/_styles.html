<style>
  /* ── Page header ── */
  .an-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px 16px; flex-wrap:wrap; margin-bottom:1.5rem; }
  .an-title { font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.5px; color:var(--ink); margin:0; display:flex; align-items:center; gap:10px; }
  .an-title i { color:var(--primary2); font-size:22px; }
  .an-sub { color:var(--ink2); font-size:13.5px; margin:6px 0 0; line-height:1.5; }

  /* ── Buttons ── */
  .an-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:13px; font-weight:700; color:#fff !important; background:var(--primary);
            border:1px solid transparent; padding:10px 18px; border-radius:10px; text-decoration:none; cursor:pointer; font-family:var(--font-body); transition:all .18s; line-height:1.2; }
  .an-btn:hover { background:var(--primary2); box-shadow:0 4px 14px var(--p-glow); }
  .an-btn:focus-visible { outline:2px solid var(--primary2); outline-offset:2px; }
  .an-btn:disabled { opacity:.6; cursor:not-allowed; box-shadow:none; }
  .an-btn-ghost { background:transparent; color:var(--ink2) !important; border-color:var(--border2); padding:7px 12px; font-size:12.5px; font-weight:600; }
  .an-btn-ghost:hover { background:var(--p-soft); color:var(--primary2) !important; box-shadow:none; border-color:var(--primary); }
  .an-btn-danger:hover { background:var(--red-soft); color:var(--red) !important; border-color:var(--red); }

  /* ── Cards ── */
  .an-list { display:flex; flex-direction:column; gap:14px; max-width:900px; }
  .an-card { display:flex; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.2rem 1.4rem; transition:border-color .18s; }
  .an-card:hover { border-color:var(--border2); }
  .an-card.pinned { border-color:rgba(108,99,255,.55); background:linear-gradient(180deg, var(--p-soft), transparent 70%), var(--surface); }
  .an-card.expired { opacity:.6; }
  .an-avatar { width:40px; height:40px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
               background:var(--p-soft); color:var(--primary2); font-family:var(--font-display); font-weight:800; font-size:16px; }
  .an-card.pinned .an-avatar { background:var(--primary); color:#fff; }
  .an-body { flex:1; min-width:0; }
  .an-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .an-card-title { font-family:var(--font-display); font-size:17px; font-weight:700; letter-spacing:-.2px; color:var(--ink); margin:0; line-height:1.35; word-break:break-word; }
  .an-by { font-size:12.5px; color:var(--ink3); margin-top:3px; }
  .an-msg { color:var(--ink2); font-size:14px; line-height:1.65; margin:12px 0 14px; white-space:pre-line; word-break:break-word; }
  .an-msg a { color:var(--primary2); text-decoration:underline; text-underline-offset:2px; }
  .an-msg.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .an-more { background:none; border:0; padding:0; margin:-6px 0 12px; font:inherit; font-size:12.5px; font-weight:700; color:var(--primary2); cursor:pointer; }
  .an-more:hover { text-decoration:underline; }
  .an-meta { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:12px; color:var(--ink3); }
  .an-meta i { margin-right:4px; }
  .an-chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:50px; background:var(--p-soft); color:var(--primary2); text-decoration:none; }
  a.an-chip:hover { background:var(--primary); color:#fff; }
  .an-chip.pin { background:var(--primary); color:#fff; }
  .an-chip.warn { background:var(--red-soft); color:var(--red); }
  .an-chip.ok { background:var(--green-soft); color:var(--green); }
  .an-actions { display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; }
  .an-actions form { margin:0; }
  .an-field-error { color:var(--red); font-size:12.5px; margin-top:6px; display:flex; gap:6px; align-items:flex-start; }

  /* ── Empty state ── */
  .an-empty { text-align:center; padding:56px 20px; color:var(--ink3); background:var(--surface); border:1px dashed var(--border2); border-radius:var(--radius-lg); }
  .an-empty i { font-size:34px; opacity:.35; margin-bottom:12px; }
  .an-empty h3 { font-family:var(--font-display); color:var(--ink); font-size:17px; margin-bottom:6px; }
  .an-empty p { font-size:13.5px; max-width:360px; margin:0 auto 16px; line-height:1.55; }

  @media (max-width:560px) {
    .an-card { padding:1rem; gap:11px; }
    .an-avatar { width:34px; height:34px; border-radius:10px; font-size:14px; }
    .an-actions { width:100%; }
  }
</style>
