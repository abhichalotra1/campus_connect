{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="mb-4">
                <i class="fa-solid fa-user-shield text-primary me-2"></i>Edit Admin Profile
            </h3>

            <form method="POST">
                {% csrf_token %}

                <h6 class="text-muted text-uppercase fw-bold mb-3" style="font-size:11px; letter-spacing:1px;">
                    Personal Information
                </h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control"
                               value="{{ request.user.first_name }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control"
                               value="{{ request.user.last_name }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ request.user.phone }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               value="{{ request.user.email }}" disabled>
                        <small class="text-muted">Email cannot be changed here.</small>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                    </button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
