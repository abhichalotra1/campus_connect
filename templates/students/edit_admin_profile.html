{% extends "dashboard_base.html" %}
{% block breadcrumb_page_name %}Edit Admin Profile{% endblock %}

{% block dashboard_content %}
<style>
  /* ── EDIT PROFILE STYLES ── */
  .ep-wrapper {
    display: flex;
    justify-content: center;
    padding-top: 1rem;
    padding-bottom: 2rem;
  }
  .ep-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    width: 100%;
    max-width: 700px;
    transition: border-color 0.2s;
  }
  .ep-card:hover { border-color: var(--border2); }

  .ep-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.75rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .ep-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--p-soft);
    color: var(--primary2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .ep-title {
    font-family: var(--font-display);
    font-weight: 800; font-size: 20px;
    color: var(--ink); margin: 0;
  }

  .section-label {
    font-size: 11px; color: var(--ink3); font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 16px; font-family: var(--font-mono);
  }

  /* Forms */
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .form-control {
    background: var(--bg2) !important; border: 1px solid var(--border2) !important;
    color: var(--ink) !important; border-radius: 10px !important;
    font-family: var(--font-body) !important; font-size: 14px !important;
    padding: 0.65rem 0.85rem !important; transition: all 0.18s !important;
  }
  .form-control:focus {
    border-color: var(--primary) !important; box-shadow: 0 0 0 3px var(--p-soft) !important;
    background: var(--bg3) !important;
  }
  .form-control:disabled {
    background: var(--bg3) !important; color: var(--ink3) !important;
    border-color: var(--border) !important; cursor: not-allowed; opacity: 0.7;
  }
  .form-control::placeholder { color: var(--ink3) !important; }
  .form-hint { font-size: 12px; color: var(--ink3); margin-top: 4px; }

  /* Action Buttons */
  .action-bar {
    display: flex; gap: 10px; margin-top: 24px;
    padding-top: 1.25rem; border-top: 1px solid var(--border);
  }
  .btn-save {
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    color: #fff; background: var(--primary); border: none; padding: 10px 20px;
    border-radius: 10px; cursor: pointer; transition: all 0.18s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-save:hover { background: var(--primary2); box-shadow: 0 4px 12px var(--p-glow); }

  .btn-cancel {
    font-family: var(--font-body); font-weight: 600; font-size: 14px;
    color: var(--ink2); background: transparent; border: 1px solid var(--border2);
    padding: 10px 20px; border-radius: 10px; cursor: pointer;
    text-decoration: none; transition: all 0.18s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-cancel:hover { background: var(--surface2); color: var(--ink); border-color: var(--ink3); }

  @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div class="ep-wrapper">
  <div class="ep-card">
    <div class="ep-header">
      <div class="ep-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h3 class="ep-title">Edit Admin Profile</h3>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="section-label">Personal Information</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ request.user.first_name }}">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ request.user.last_name }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" value="{{ request.user.phone }}" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" value="{{ request.user.email }}" disabled>
          <div class="form-hint">Email cannot be changed here.</div>
        </div>
      </div>

      <div class="action-bar">
        <button type="submit" class="btn-save" onclick="submitWithLoading(this, 'Saving...')">
          <i class="fa-solid fa-floppy-disk"></i> Save Changes
        </button>
        <a href="{% url 'profile' %}" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
