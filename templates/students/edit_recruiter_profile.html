{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 style="font-family: var(--font-display); font-weight: 800; margin: 0;">
                <i class="fas fa-pen me-2" style="color: var(--primary2);"></i>Edit Recruiter Profile
            </h3>
            <a href="{% url 'profile' %}" style="font-size: 13px; color: var(--ink3); text-decoration: none; font-weight: 600;"><i class="fas fa-arrow-left me-1"></i> Back to Profile</a>
        </div>

        <div class="card p-4" style="border-radius: var(--radius-lg);">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="row">
                    <!-- Left Column -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" name="company_name" class="form-control" value="{{ profile.company_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Industry</label>
                            <input type="text" name="industry" class="form-control" value="{{ profile.industry }}" placeholder="e.g., IT Services, Finance">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Designation (Your Role)</label>
                            <input type="text" name="designation" class="form-control" value="{{ profile.designation }}" placeholder="e.g., HR Manager">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Profile Picture</label>
                            <input type="file" name="profile_pic" class="form-control" accept="image/*">
                            {% if profile.profile_pic %}
                                <small class="text-muted mt-1 d-block">Current: <a href="{{ profile.profile_pic.url }}" target="_blank" style="color: var(--primary2);">View Image</a></small>
                            {% endif %}
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Company Website</label>
                            <input type="url" name="company_website" class="form-control" value="{{ profile.company_website }}" placeholder="https://example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Company Address</label>
                            <input type="text" name="company_address" class="form-control" value="{{ profile.company_address }}" placeholder="City, State">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">LinkedIn Profile</label>
                            <input type="url" name="linkedin" class="form-control" value="{{ profile.linkedin }}" placeholder="https://linkedin.com/in/...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">About the Company</label>
                            <textarea name="about" class="form-control" rows="4" placeholder="Brief description of your company...">{{ profile.about }}</textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2" style="font-weight: 700; padding: 12px; border-radius: 10px;">
                    <i class="fas fa-check me-2"></i>Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
