{% extends 'base.html' %}

{% block content %}
<style>
  /* ── SHARED AUTH STYLES (Also in login.html for independence) ── */
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 3rem;
    padding-bottom: 3rem;
    min-height: 70vh;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    width: 100%;
    max-width: 540px; /* Slightly wider for 2-col forms */
    transition: border-color 0.2s;
  }
  .auth-card:hover { border-color: var(--border2); }

  .auth-header { text-align: center; margin-bottom: 2rem; }
  .auth-title {
    font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); margin: 0 0 4px;
  }
  .auth-subtitle { color: var(--ink3); font-size: 14px; }



  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .form-control, .form-select {
    background: var(--bg2) !important; border: 1px solid var(--border2) !important; color: var(--ink) !important;
    border-radius: 10px !important; font-family: var(--font-body) !important; font-size: 14px !important;
    padding: 0.65rem 0.85rem !important; transition: all 0.18s !important;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--primary) !important; box-shadow: 0 0 0 3px var(--p-soft) !important; background: var(--bg3) !important;
  }
  .form-control::placeholder { color: var(--ink3) !important; }

  .cc-alert {
    padding: 11px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .cc-alert.error { background: var(--red-soft); border: 1px solid rgba(244,63,94,0.3); color: var(--red); }
  .cc-alert.success { background: var(--green-soft); border: 1px solid rgba(34,211,160,0.3); color: var(--green); }

  .btn-auth {
    font-family: var(--font-display); font-weight: 800; font-size: 15px; color: #fff; background: var(--primary);
    border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.18s;
  }
  .btn-auth:hover { background: var(--primary2); box-shadow: 0 6px 20px var(--p-glow); }

  .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink3); }
  .auth-link { color: var(--primary2); font-weight: 700; text-decoration: none; transition: color 0.15s; }
  .auth-link:hover { color: var(--ink); }

  .role-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .role-opt { position: relative; cursor: pointer; margin: 0; }
  .role-opt input { position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; margin: 0; pointer-events: none; }
  .role-card {
    display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center;
    padding: 14px 10px; border-radius: 12px; background: var(--bg2);
    border: 2px solid var(--border2); color: var(--ink2); transition: all 0.18s;
  }
  .role-card i { font-size: 20px; color: var(--ink3); margin-bottom: 2px; }
  .role-card strong { font-family: var(--font-display); font-size: 15px; color: var(--ink); }
  .role-card small { font-size: 12px; color: var(--ink3); }
  .role-opt:hover .role-card { border-color: var(--primary); }
  .role-opt input:checked + .role-card { border-color: var(--primary); background: var(--p-soft); }
  .role-opt input:checked + .role-card i { color: var(--primary2); }
  .role-opt input:focus-visible + .role-card { box-shadow: 0 0 0 3px var(--p-soft); }

  @media(max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h3 class="auth-title">Create your account</h3>
      <p class="auth-subtitle">Start your placement journey today</p>
    </div>

    <!-- Manual Registration Form -->
    <form method="POST">
      {% csrf_token %}
      
      {% if messages %}
        {% for message in messages %}
        <div class="cc-alert {{ message.tags }}">
          <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
        </div>
        {% endfor %}
      {% endif %}

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" placeholder="John" value="{{ form.first_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" placeholder="Doe" value="{{ form.last_name }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" autocomplete="username" class="form-control" placeholder="Choose a username" value="{{ form.username }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" autocomplete="email" class="form-control" placeholder="you@example.com" value="{{ form.email }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" autocomplete="tel" name="phone" class="form-control" placeholder="+91 98765 43210" maxlength="15" value="{{ form.phone }}">
      </div>
      
      <!-- Role Selection: both choices always visible, nothing pre-selected -->
      <div class="form-group">
        <span class="form-label" id="roleLabel">I am a...</span>
        <div class="role-picker" role="radiogroup" aria-labelledby="roleLabel">
          <label class="role-opt">
            <input type="radio" name="role" value="student" required {% if form.role == 'student' %}checked{% endif %}>
            <span class="role-card">
              <i class="fa-solid fa-user-graduate"></i>
              <strong>Student</strong>
              <small>Find jobs &amp; internships</small>
            </span>
          </label>
          <label class="role-opt">
            <input type="radio" name="role" value="recruiter" required {% if form.role == 'recruiter' %}checked{% endif %}>
            <span class="role-card">
              <i class="fa-solid fa-briefcase"></i>
              <strong>Recruiter</strong>
              <small>Post drives &amp; hire</small>
            </span>
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password1" autocomplete="new-password" class="form-control" placeholder="Min 8 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="password2" autocomplete="new-password" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn-auth" data-loading-text="Creating...">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'login' %}" class="auth-link">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
