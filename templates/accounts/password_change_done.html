{% extends "dashboard_base.html" %}
{% block breadcrumb_page_name %}Password Updated{% endblock %}

{% block dashboard_content %}
<style>
  /* ── SUCCESS STATE STYLES ── */
  .success-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 3rem;
    min-height: 60vh;
  }
  .success-card {
    background: var(--surface);
    border: 1px solid rgba(34,211,160,0.2);
    border-radius: var(--radius-lg);
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 480px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .success-card:hover { border-color: rgba(34,211,160,0.4); }

  /* Top accent line */
  .success-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--green);
  }

  .success-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
  }
  .success-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .success-msg {
    color: var(--ink2);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 28px;
  }

  .btn-dashboard {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: var(--primary);
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.18s;
  }
  .btn-dashboard:hover { background: var(--primary2); box-shadow: 0 6px 20px var(--p-glow); }
</style>

<div class="success-wrapper">
  <div class="success-card">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    <h3 class="success-title">Password Changed!</h3>
    <p class="success-msg">
      Your password has been updated successfully.<br>
      Please use your new password the next time you log in.
    </p>
    <a href="{% url 'dashboard' %}" class="btn-dashboard">
      <i class="fas fa-house"></i> Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
