{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-5 text-center" style="border-radius: var(--radius-lg); border: 1px solid rgba(34,211,160,0.3);">
            <i class="fas fa-check-circle fa-3x mb-3" style="color: var(--green);"></i>
            <h3 style="font-family: var(--font-display); font-weight: 800;">Password Changed!</h3>
            <p style="color: var(--ink2); font-size: 14px; margin-top: 12px; line-height: 1.6;">
                Your password has been updated successfully.<br>
                Please use your new password the next time you log in.
            </p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3" style="font-weight: 700; padding: 12px 28px; border-radius: 10px; text-decoration: none;">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
