<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Campus Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--bg2:#0e1018;--bg3:#13151f;--surface:#181b26;--surface2:#1e2130;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--ink:#eef0ff;--ink2:#9298b8;--ink3:#4e5370;--a:#5b6cff;--a2:#7d8bff;--a-glow:rgba(91,108,255,0.22);--a-soft:rgba(91,108,255,0.10);--g:#1ed98a;--g-soft:rgba(30,217,138,0.10);--r:#ff5470;--r-soft:rgba(255,84,112,0.10);--radius:14px;--radius-lg:20px}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse at 50% 0%,rgba(91,108,255,0.12) 0%,transparent 65%);pointer-events:none;z-index:0}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 30%,transparent 100%);pointer-events:none;z-index:0}
nav{position:relative;z-index:10;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(8,9,13,0.6);backdrop-filter:blur(20px)}
.nav-logo{font-family:'Clash Display',sans-serif;font-size:19px;font-weight:700;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;position:relative}
.logo-mark::after{content:'';position:absolute;inset:-3px;border-radius:11px;border:1px solid rgba(91,108,255,0.35)}
.nav-back{font-size:13px;color:var(--ink2);text-decoration:none;display:flex;align-items:center;gap:7px;transition:color 0.18s}
.nav-back:hover{color:var(--ink)}
main{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.auth-card{width:100%;max-width:420px;animation:fadeUp 0.6s ease both}
.auth-header{text-align:center;margin-bottom:28px}
.auth-icon{width:60px;height:60px;border-radius:18px;background:var(--a-soft);border:1px solid rgba(91,108,255,0.25);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px;color:var(--a2)}
.auth-title{font-family:'Clash Display',sans-serif;font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--ink2);line-height:1.65}
.form-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:30px;position:relative;overflow:hidden}
.form-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--a),transparent);opacity:0.5}
.field{margin-bottom:18px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.input-wrap{position:relative}
.input-wrap .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none;transition:color 0.18s}
.input-wrap input{width:100%;padding:12px 13px 12px 40px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--ink);font-family:'Cabinet Grotesk',sans-serif;font-size:14px;font-weight:500;outline:none;transition:all 0.18s;-webkit-appearance:none}
.input-wrap input::placeholder{color:var(--ink3)}
.input-wrap input:focus{border-color:var(--a);background:var(--bg3);box-shadow:0 0 0 3px var(--a-soft)}
.input-wrap:focus-within .input-icon{color:var(--a2)}
.btn-submit{width:100%;padding:13px;border-radius:10px;border:none;background:var(--a);color:#fff;font-family:'Cabinet Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s}
.btn-submit::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.16) 0%,transparent 55%)}
.btn-submit:hover{background:var(--a2);transform:translateY(-1px);box-shadow:0 8px 24px var(--a-glow)}
.auth-footer{text-align:center;margin-top:20px;font-size:13.5px;color:var(--ink2)}
.auth-footer a{color:var(--a2);text-decoration:none;font-weight:600;transition:color 0.15s}
.auth-footer a:hover{color:var(--ink)}
/* success state */
.success-box{text-align:center;padding:10px 0}
.success-icon{width:64px;height:64px;border-radius:50%;background:var(--g-soft);border:1px solid rgba(30,217,138,0.3);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;color:var(--g)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<nav>
  <a class="nav-logo" href="/"><div class="logo-mark"><i class="fa-solid fa-graduation-cap"></i></div>Campus Connect</a>
  <a class="nav-back" href="/accounts/login/"><i class="fa-solid fa-arrow-left" style="font-size:11px;"></i>Back to sign in</a>
</nav>

<main>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    <div class="form-box">
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="id_email">Email address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="id_email" name="email" placeholder="you@college.edu" required autocomplete="email">
          </div>
        </div>
<button type="submit" class="btn-submit" onclick="submitWithLoading(this, 'Sending...')"><i class="fa-solid fa-paper-plane" style="margin-right:8px;"></i>Send Reset Link</button>      </form>
    </div>
    <div class="auth-footer">Remember your password? <a href="/accounts/login/">Sign in →</a></div>
  </div>
</main>
</body>
</html>
