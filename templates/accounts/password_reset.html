{% extends 'base.html' %}

{% block content %}
<style>
  /* ── AUTH PAGES LAYOUT ── */
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 3rem 1rem;
    min-height: 75vh;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    width: 100%;
    max-width: 440px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  /* Top accent line */
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
  }

  .auth-header { text-align: center; margin-bottom: 2rem; }
  .auth-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--p-soft);
    border: 1px solid rgba(79,70,229,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin: 0 auto 16px; color: var(--primary2);
  }
  .auth-title {
    font-family: var(--font-display); font-weight: 800; font-size: 24px;
    color: var(--ink); margin: 0 0 6px; letter-spacing: -0.5px;
  }
  .auth-subtitle { color: var(--ink2); font-size: 14px; line-height: 1.6; }

  /* Forms */
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; position: relative; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--ink3); font-size: 13px; pointer-events: none; transition: color 0.18s;
  }
  .form-control {
    background: var(--bg2) !important; border: 1px solid var(--border2) !important;
    color: var(--ink) !important; border-radius: 10px !important;
    font-family: var(--font-body) !important; font-size: 14px !important;
    padding: 0.65rem 0.85rem 0.65rem 2.5rem !important; transition: all 0.18s !important; width: 100%;
  }
  .form-control:focus {
    border-color: var(--primary) !important; box-shadow: 0 0 0 3px var(--p-soft) !important;
    background: var(--bg3) !important;
  }
  .form-control:focus + .input-icon { color: var(--primary2); }
  .form-control::placeholder { color: var(--ink3) !important; }

  /* Submit */
  .btn-auth {
    font-family: var(--font-display); font-weight: 800; font-size: 15px; color: #fff;
    background: var(--primary); border: none; padding: 12px; border-radius: 10px;
    cursor: pointer; width: 100%; transition: all 0.18s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-auth:hover { background: var(--primary2); box-shadow: 0 6px 20px var(--p-glow); }

  /* Footer Links */
  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink3);
  }
  .auth-link { color: var(--primary2); font-weight: 700; text-decoration: none; transition: color 0.15s; }
  .auth-link:hover { color: var(--ink); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="id_email" name="email" class="form-control" placeholder="you@college.edu" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <button type="submit" class="btn-auth" onclick="submitWithLoading(this, 'Sending...')">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="{% url 'login' %}" class="auth-link">Sign in →</a>
    </div>
  </div>
</div>
{% endblock %}
