{% extends 'base.html' %}

{% block content %}
<style>
  /* ── AUTH PAGES LAYOUT ── */
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 3rem;
    padding-bottom: 3rem;
    min-height: 70vh;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    width: 100%;
    max-width: 440px;
    transition: border-color 0.2s;
  }
  .auth-card:hover { border-color: var(--border2); }

  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    margin: 0 auto 16px;
    box-shadow: 0 0 0 4px var(--p-soft);
  }
  .auth-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .auth-subtitle { color: var(--ink3); font-size: 14px; }

  /* Social Buttons */

  /* Divider */

  /* Forms */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 18px;
  }
  .form-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .form-control {
    background: var(--bg2) !important;
    border: 1px solid var(--border2) !important;
    color: var(--ink) !important;
    border-radius: 10px !important;
    font-family: var(--font-body) !important;
    font-size: 14px !important;
    padding: 0.65rem 0.85rem !important;
    transition: all 0.18s !important;
  }
  .form-control:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px var(--p-soft) !important;
    background: var(--bg3) !important;
  }
  .form-control::placeholder { color: var(--ink3) !important; }

  /* Alerts */
  .cc-alert {
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .cc-alert.error { background: var(--red-soft); border: 1px solid rgba(244,63,94,0.3); color: var(--red); }

  /* Submit */
  .btn-auth {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    color: #fff;
    background: var(--primary);
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
  }
  .btn-auth:hover { background: var(--primary2); box-shadow: 0 6px 20px var(--p-glow); }

  /* Footer Links */
  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink3);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .auth-link { color: var(--primary2); font-weight: 700; text-decoration: none; transition: color 0.15s; }
  .auth-link:hover { color: var(--ink); }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-graduation-cap"></i></div>
      <h3 class="auth-title">Welcome Back</h3>
      <p class="auth-subtitle">Sign in to access your dashboard</p>
    </div>

    <!-- Email Login Form -->
    <form method="POST">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% if form.errors %}
        <div class="cc-alert error">
          <i class="fas fa-exclamation-circle"></i> Invalid username or password.
        </div>
      {% endif %}
      
      <div class="form-group">
        <label class="form-label">Username or email</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username or email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="btn-auth" onclick="submitWithLoading(this, 'Signing In...')">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'password_reset' %}" class="auth-link">Forgot Password?</a>
      <div>Don't have an account? <a href="{% url 'register' %}" class="auth-link">Create one</a></div>
    </div>
  </div>
</div>
{% endblock %}
