<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset — Campus Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--bg2:#0e1018;--surface:#181b26;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--ink:#eef0ff;--ink2:#9298b8;--ink3:#4e5370;--a:#5b6cff;--a2:#7d8bff;--a-glow:rgba(91,108,255,0.22);--a-soft:rgba(91,108,255,0.10);--g:#1ed98a;--g-soft:rgba(30,217,138,0.10);--radius-lg:20px}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse at 50% 0%,rgba(30,217,138,0.1) 0%,transparent 65%);pointer-events:none;z-index:0}
nav{position:relative;z-index:10;padding:20px 5%;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(8,9,13,0.6);backdrop-filter:blur(20px)}
.nav-logo{font-family:'Clash Display',sans-serif;font-size:19px;font-weight:700;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;position:relative}
.logo-mark::after{content:'';position:absolute;inset:-3px;border-radius:11px;border:1px solid rgba(91,108,255,0.35)}
main{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.auth-card{width:100%;max-width:420px;text-align:center;animation:fadeUp 0.6s ease both}
.confetti{font-size:48px;margin-bottom:18px;animation:bounce 0.6s 0.3s ease both;display:block;transform:scale(0)}
@keyframes bounce{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.auth-title{font-family:'Clash Display',sans-serif;font-size:30px;font-weight:700;letter-spacing:-1px;margin-bottom:10px}
.auth-sub{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:28px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:10px;background:var(--a);color:#fff;font-family:'Cabinet Grotesk',sans-serif;font-size:15px;font-weight:700;text-decoration:none;transition:all 0.2s;position:relative;overflow:hidden}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.16) 0%,transparent 55%)}
.btn-primary:hover{background:var(--a2);transform:translateY(-1px);box-shadow:0 8px 24px var(--a-glow)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<nav><a class="nav-logo" href="/"><div class="logo-mark"><i class="fa-solid fa-graduation-cap"></i></div>Campus Connect</a></nav>
<main>
  <div class="auth-card">
    <span class="confetti">🎉</span>
    <h1 class="auth-title">Password reset!</h1>
    <p class="auth-sub">Your password has been successfully changed. You can now sign in with your new password.</p>
    <a class="btn-primary" href="/accounts/login/">
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
      Sign In Now
    </a>
  </div>
</main>
</body>
</html>
