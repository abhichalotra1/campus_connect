{% extends 'base.html' %}

{% block content %}
<style>
  /* ── SUCCESS STATE STYLES ── */
  .success-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 3rem 1rem;
    min-height: 75vh;
  }
  .success-card {
    background: var(--surface);
    border: 1px solid rgba(34,211,160,0.2);
    border-radius: var(--radius-lg);
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 440px;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  /* Top accent line */
  .success-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--green);
  }

  .success-emoji {
    font-size: 48px;
    margin-bottom: 18px;
    display: block;
    animation: bounce 0.6s 0.3s ease both;
    transform: scale(0);
  }
  .success-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: -0.5px;
  }
  .success-msg {
    color: var(--ink2);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 28px;
  }

  .btn-signin {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: var(--primary);
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.18s;
  }
  .btn-signin:hover { background: var(--primary2); box-shadow: 0 6px 20px var(--p-glow); transform: translateY(-1px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
</style>

<div class="success-wrapper">
  <div class="success-card">
    <span class="success-emoji">🎉</span>
    <h1 class="success-title">Password reset!</h1>
    <p class="success-msg">
      Your password has been successfully changed.<br>
      You can now sign in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-signin">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In Now
    </a>
  </div>
</div>
{% endblock %}
