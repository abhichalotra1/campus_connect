{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <i class="fas fa-envelope fa-3x mb-3" style="color:var(--primary)"></i>
      <h4 class="mb-2">Confirm Your Email</h4>
      <p class="text-muted mb-4" style="font-size:13px;">
        Please confirm your email address to complete sign up.
      </p>
      {% if confirmation %}
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-check me-2"></i>Confirm Email
        </button>
      </form>
      {% else %}
      <p class="text-muted">This confirmation link is invalid or has expired.</p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-2">Back to Login</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
